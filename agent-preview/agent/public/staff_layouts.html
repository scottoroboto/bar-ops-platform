<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Venue Control Agent — Layouts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="staff-theme.css">
<style>
  /* Layouts-specific bits not shared with sources/tvs. */
  .layout-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); padding: 14px 0; }
  .layout-row:last-child { border-bottom: none; }
  .layout-name { font-size: 16px; font-weight: 600; }
  .layout-desc { color: var(--muted-strong); font-size: 13px; margin-top: 2px; }
  .layout-count { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #undoBar .countdown { color: var(--muted-strong); font-size: 12.5px; }
</style>
</head>
<body class="staff">
<div class="wrap" id="pinGate">
  <div class="card">
    <h2>Layouts</h2>
    <p class="muted">Enter the staff PIN to apply a room layout.</p>
    <div class="field"><input type="password" id="pinInput" placeholder="Staff PIN" autocomplete="off"></div>
    <button class="primary" onclick="submitPin()">Continue</button>
    <div id="pinMsg"></div>
  </div>
</div>

<div id="app">
  <!-- Branded top bar, shared shape with staff_sources.html/staff_tvs.html --
       see staff-theme.css's .staff-topbar rules. No quick-remote button here,
       matching screens/07-staff-layouts.html -- applying a preset isn't
       bound to one device the way the other two pages are. -->
  <div class="staff-topbar">
    <div class="staff-topbar-inner">
      <div class="tb-brand">
        <img class="tb-logo" src="ticket-logo.png" alt="Ticket Sports Bar">
        <div class="tb-divider"></div>
        <a href="/" title="Agent status"><span class="tb-conn-dot"></span></a>
      </div>
      <div class="tb-nav">
        <a href="/staff_sources.html">Sources</a>
        <a href="/staff_tvs.html">TVs</a>
        <a href="/staff_layouts.html" class="active">Layouts</a>
        <div class="tb-divider" style="height:40px; margin:0 6px;"></div>
        <div class="tb-clock">
          <div class="day" id="tbDay">—</div>
          <div class="time" id="tbTime">—</div>
          <div class="date" id="tbDate">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <h2 style="margin:0;">Saved layouts</h2>
      <div id="layoutsBox" style="margin-top:10px;"><p class="muted">Loading…</p></div>
    </div>

    <div id="applyProgress"></div>
  </div>
</div>

<div id="undoBar">
  <div>
    <div id="undoText"></div>
    <div class="countdown" id="undoCountdown"></div>
  </div>
  <button class="primary" onclick="undoApply()">Undo</button>
</div>

<script src="staff_layouts.js"></script>
</body>
</html>
