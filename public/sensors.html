<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Coolers — Bar Ops</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .sn-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  @media (min-width: 700px) { .sn-tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  .sn-tile { display: flex; flex-direction: column; gap: 3px; border-radius: 12px; padding: 10px 10px 8px; color: #fff; min-height: 86px; text-align: left; border: 0; font-family: inherit; cursor: pointer; }
  .sn-tile .nm { font-size: 12px; font-weight: 700; opacity: .95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sn-tile .deg { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-style: italic; font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -.03em; }
  .sn-tile .meta { display: flex; justify-content: space-between; font-size: 10px; opacity: .9; margin-top: auto; }
  .sn-normal { background: #2f7a26; } .sn-high, .sn-low { background: #b5171e; } .sn-error { background: #b26a0c; } .sn-silent, .sn-unknown { background: #3e434d; }
  .sn-kick { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .sn-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--card-border); font-size: 13px; }
  .sn-row:first-child { border-top: 0; }
  .sn-alert { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: #2a1416; border: 1px solid #7a2a30; margin-bottom: 8px; }
  .sn-alert.quiet { background: #2a1a08; border-color: #6a4a1a; }
  .sn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .sn-grid label { display: block; margin-top: 10px; font-weight: 600; font-size: 13px; }
  .sn-grid input, .sn-grid select { width: 100%; }
  .sn-bars { display: flex; align-items: flex-end; gap: 1px; height: 110px; position: relative; margin-top: 8px; }
  .sn-bars span { flex: 1; border-radius: 2px 2px 0 0; background: #3f8f35; min-height: 2px; }
  .sn-bars span.h { background: #c91f26; } .sn-bars span.l { background: #2f6fd9; } .sn-bars span.x { background: #3a4152; }
  .sn-seg { display: inline-flex; gap: 6px; }
  .sn-seg button { margin: 0; padding: 6px 10px; font-size: 12px; }
  .sn-seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .sn-pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #1f2430; color: var(--muted); }
  .sn-pill.warn { background: #3a2a0e; color: #ffd9a0; } .sn-pill.bad { background: #3a1416; color: #ffb3b8; } .sn-pill.ok { background: #1f3a2a; color: #9fe8c0; }
  .sn-inline { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .sn-inline select, .sn-inline button { margin: 0; }
  .sn-inline select { width: auto; padding: 6px 8px; font-size: 12px; }
  .small { padding: 6px 10px; font-size: 12px; }
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<div class="wrap" id="app">
  <div id="msgBox"></div>
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
      <div><h1 style="margin:0;">Coolers</h1><p class="muted" style="margin:4px 0 0;">Keg and kitchen cooler temperatures from the sensor boxes. Red means above the limit for the set minutes; grey means no reading.</p></div>
      <select id="snLocation" onchange="loadAll()" style="width:auto; margin:0;"></select>
    </div>
  </div>

  <div id="alertsBox"></div>
  <div id="coolersBox"></div>
  <div id="detailBox"></div>
  <div id="newBox"></div>
  <div id="nodesBox"></div>
  <div id="gatewaysBox"></div>
  <div id="eventsBox"></div>
  <div id="settingsBox"></div>
</div>
<script src="/common.js"></script>
<script src="/sensors.js"></script>
</body>
</html>
