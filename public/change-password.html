<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Change Password — Bar Ops</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<div class="wrap" id="app">
<div id="msgBox"></div>
<div class="card">
<h1>Change your password</h1>
<p class="muted">This needs a quick password re-check first, since it's a sensitive change.</p>
<label for="pw1">New password (8+ characters)</label>
<input id="pw1" type="password">
<label for="pw2">Confirm password</label>
<input id="pw2" type="password">
<button class="primary" onclick="submitPassword()">Save password</button>
<button class="secondary" onclick="location.href='/dashboard.html'">Cancel</button>
</div>
</div>
<script src="/common.js"></script>
<script>
function showMsg(text, kind) {
document.getElementById('msgBox').innerHTML = text ? `<div class="msg ${kind || 'info'}">${escapeHtml(text)}</div>` : '';
}
async function submitPassword() {
const p1 = document.getElementById('pw1').value;
const p2 = document.getElementById('pw2').value;
if (p1.length < 8) { showMsg('Password needs to be at least 8 characters.', 'error'); return; }
if (p1 !== p2) { showMsg('Passwords don\'t match.', 'error'); return; }
try {
await withStepUp(() => api('/api/auth/set-password', { method: 'POST', body: { password: p1 } }));
showMsg('Password updated.', 'success');
setTimeout(() => location.href = '/dashboard.html', 900);
} catch (e) {
showMsg(e.message, 'error');
}
}
(function () {
const person = requireAuth();
if (!person) return;
renderTopbar('Change Password');
})();
</script>
</body>
</html>
