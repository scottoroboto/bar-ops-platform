<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Service Calls — Bar Ops</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<div class="wrap wide" id="app">
  <p><a href="/dashboard.html">&larr; Home</a></p>
  <div id="msgBox"></div>
  <div class="tabs" id="tabs"></div>

  <div id="panelOpen"></div>
  <div id="panelNew" style="display:none;"></div>
  <div id="panelReports" style="display:none;"></div>
</div>

<!-- Close-call modal -->
<div class="card" id="closeModal" style="display:none; position:fixed; inset:0; margin:auto; max-width:420px; height:fit-content; top:15%; z-index:20;">
  <h2>Close this call</h2>
  <input type="hidden" id="closeCallId">
  <p class="muted" id="closeCallDesc"></p>
  <label for="closeRemedy">What fixed it?</label>
  <textarea id="closeRemedy" rows="3" placeholder="e.g. Reset the breaker and cleared the drain line"></textarea>
  <div class="stack-actions">
    <button class="ghost" onclick="closeCloseModal()">Cancel</button>
    <button class="primary" style="margin-top:0;" onclick="submitClose()">Mark closed</button>
  </div>
</div>
<div id="modalBackdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:10;" onclick="closeCloseModal()"></div>

<script src="/common.js"></script>
<script src="/servicecalls.js"></script>
</body>
</html>
