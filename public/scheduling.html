<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Scheduling — Bar Ops</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/scheduling.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<div class="wrap wide" id="app">
  <nav id="sidebarNav"></nav>
  <main class="sched-main">
    <div class="sched-topline">
      <h1 id="schedPageTitle">Scheduler</h1>
      <div class="who muted" id="schedWho"></div>
    </div>
    <div id="msgBox"></div>

    <div id="panelMine"></div>
    <div id="panelScheduler" style="display:none;"></div>
    <div id="panelTimeOff" style="display:none;"></div>
    <div id="panelSetup" style="display:none;"></div>
  </main>
</div>

<!-- Add/Edit shift modal (Scheduler tab) -->
<div class="card" id="shiftModal" style="display:none; position:fixed; inset:0; margin:auto; max-width:420px; max-height:86vh; overflow-y:auto; height:fit-content; top:6%; z-index:20;">
  <h2 id="shiftModalTitle">Shift</h2>
  <input type="hidden" id="shDraftId">
  <input type="hidden" id="shShiftId">
  <div id="shFixed" style="display:none; margin:0 0 10px; font-size:15px;"></div>
  <div id="shPersonWrap"><label for="shPerson">Employee</label>
  <select id="shPerson"></select></div>
  <div id="shScheduleWrap"><label for="shSchedule">Schedule</label>
  <select id="shSchedule"></select></div>
  <label for="shPosition">Position</label>
  <select id="shPosition"></select>
  <label for="shDate">Date</label>
  <input type="date" id="shDate">
  <div style="display:flex; gap:10px;">
    <div style="flex:1;"><label for="shStart">Start</label><select id="shStart"></select></div>
    <div style="flex:1;"><label for="shEnd">End</label><select id="shEnd"></select></div>
  </div>
  <div class="sc-presets" id="shPresets"></div>
  <div id="shLong" class="msg" style="display:none; margin:8px 0 0; background:rgba(240,194,101,.12); border:1px solid #f0c265; color:#f0c265;"></div>
  <div id="shDuplicateWrap" style="display:none;">
    <label>Also add on these days this week</label>
    <div id="shDays" class="sc-days"></div>
  </div>
  <div id="shResult"></div>
  <div class="stack-actions">
    <button class="ghost" onclick="closeShiftModal()">Cancel</button>
    <button class="primary" style="margin-top:0;" onclick="submitShift()">Save as draft</button>
  </div>
  <div class="stack-actions" id="shCancelRow" style="display:none;">
    <button class="secondary" style="flex:1;" onclick="submitCancelShift()">Cancel this shift</button>
  </div>
</div>

<!-- Preview (My Schedule and Scheduler): look first, then share, download or print -->
<div class="card" id="previewModal" style="display:none; position:fixed; inset:0; margin:auto; max-width:960px; width:calc(100% - 24px); max-height:90vh; overflow:auto; height:fit-content; top:4%; z-index:21;">
  <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
    <h2 style="margin:0;" id="previewTitle">Schedule</h2>
    <div class="stack-actions" style="margin:0; gap:6px;">
      <button class="small ghost" onclick="closePreview()">Close</button>
      <button class="small secondary" id="previewShareBtn" onclick="previewShare()">Share</button>
      <button class="small secondary" onclick="previewDownload()">Download</button>
      <button class="small primary" style="margin-top:0;" onclick="previewPrint()">Print</button>
    </div>
  </div>
  <p class="muted" style="font-size:12px; margin:6px 0 10px;" id="previewHint">Share and Download send it as a picture; Print opens your printer or Save as PDF.</p>
  <div class="sched-preview" id="previewBody"></div>
</div>

<!-- Print / multi-week modal (Scheduler tab) -->
<div class="card" id="printModal" style="display:none; position:fixed; inset:0; margin:auto; max-width:460px; max-height:86vh; overflow-y:auto; height:fit-content; top:6%; z-index:20;">
  <h2>Print schedule</h2>
  <div id="printBody"></div>
  <div class="stack-actions">
    <button class="ghost" onclick="closePrintModal()">Cancel</button>
    <button class="primary" style="margin-top:0;" onclick="submitPrint()">Preview</button>
  </div>
</div>

<!-- Publish confirm / conflicts modal (Scheduler tab) -->
<div class="card" id="publishModal" style="display:none; position:fixed; inset:0; margin:auto; max-width:460px; max-height:86vh; overflow-y:auto; height:fit-content; top:6%; z-index:20;">
  <h2>Publish drafts</h2>
  <div id="publishBody"></div>
  <div class="stack-actions">
    <button class="ghost" onclick="closePublishModal()">Cancel</button>
    <button class="primary" style="margin-top:0;" id="publishConfirmBtn" onclick="doPublish()">Publish</button>
  </div>
</div>

<!-- Time off request modal (My Schedule tab) -->
<div class="card" id="timeOffModal" style="display:none; position:fixed; inset:0; margin:auto; max-width:400px; height:fit-content; top:15%; z-index:20;">
  <h2>Request time off</h2>
  <label for="toStart">First day</label>
  <input type="date" id="toStart">
  <label for="toEnd">Last day</label>
  <input type="date" id="toEnd">
  <label for="toMessage">Message (optional)</label>
  <textarea id="toMessage" rows="2" placeholder="Anything your manager should know"></textarea>
  <div id="toResult"></div>
  <div class="stack-actions">
    <button class="ghost" onclick="closeTimeOffModal()">Cancel</button>
    <button class="primary" style="margin-top:0;" onclick="submitTimeOffRequest()">Submit request</button>
  </div>
</div>

<!-- Employee qualification matrix modal (Setup tab, owner only edits) -->
<div class="card" id="qualModal" style="display:none; position:fixed; inset:0; margin:auto; max-width:460px; max-height:86vh; overflow-y:auto; height:fit-content; top:6%; z-index:20;">
  <h2 id="qualModalTitle">Manager</h2>
  <input type="hidden" id="qualPersonId">
  <label>Manages these schedules</label>
  <div id="qualManagerSchedules" class="sc-checkbox-grid"></div>
  <div id="qualResult"></div>
  <div class="stack-actions">
    <button class="ghost" onclick="closeQualModal()">Close</button>
    <button class="primary" style="margin-top:0;" id="qualSaveBtn" onclick="submitQual()">Save</button>
  </div>
</div>

<div id="modalBackdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:10;" onclick="closeAllModals()"></div>

<!-- Print-only view — hidden on screen, shown only inside the browser's print dialog -->
<div class="print-view" id="printView"></div>

<script src="/common.js"></script>
  <script src="/quarter_time.js"></script>
<script src="/scheduling.js"></script>
</body>
</html>
