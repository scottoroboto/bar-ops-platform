<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<!-- Add to Home Screen opens these full screen, no Safari bars (bar iPads, patch_053) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ticket TVs">
<link rel="apple-touch-icon" href="/ticket-logo.png">
<script src="/staff_pass_boot.js"></script>
<title>Venue Control Agent — Lights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="staff-theme.css">
</head>
<body class="staff">
<div class="wrap" id="pinGate" style="display:none;">
  <div class="card">
    <h2>Lights</h2>
    <p class="muted">This screen opens from the Bar Ops app. Tap <strong>TV Staff</strong> there and you'll land back here signed in.</p>
    <a class="primary" id="openFromApp" href="#" style="display:inline-block; text-decoration:none;">Open the Bar Ops app</a>
    <div id="pinMsg"></div>
  </div>
</div>

<div id="app">
  <!-- Same branded top bar as the other staff pages. On this tab the two
       whole-bar buttons are for the lights: ON (tap) and OFF (hold). -->
  <div class="staff-topbar">
    <div class="staff-topbar-inner">
      <div class="tb-brand">
        <img class="tb-logo" src="ticket-logo.png" alt="Ticket Sports Bar">
        <div class="tb-divider"></div>
        <a href="/" title="Agent status"><span class="tb-conn-dot"></span></a>
      </div>
      <div class="tb-actions">
        <button class="tva-btn tva-on" data-act="all-on">ALL LIGHTS ON</button>
        <button class="tva-btn tva-off hold-danger" data-hold-action="all-off"><span class="hold-fill"></span><span class="hold-label">ALL LIGHTS OFF <span class="hold-chip">HOLD</span></span></button>
      </div>
      <div class="tb-nav">
        <a href="/staff_sources.html">Sources</a>
        <a href="/staff_tvs.html">TVs</a>
        <a href="/staff_layouts.html">Routines</a>
        <a href="/staff_events.html">Events</a>
        <a href="/staff_power.html">Power</a>
        <a href="/staff_lights.html" class="active">Lights</a>
        <a href="/staff_music.html">Music</a>
        <a id="navCashOut" href="#" style="display:none;">Cash Out</a>
        <div class="tb-divider" style="height:40px; margin:0 6px;"></div>
        <div class="tb-clock">
          <div class="day" id="tbDay">—</div>
          <div class="time" id="tbTime">—</div>
          <div class="date" id="tbDate">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Routines on the left, the lights by group on the right, a sheet for
       one plug. All rendered by staff_lights.js from GET /api/lights. -->
  <div class="wrap">
    <div class="lt-workspace">
      <div class="lt-box lt-rail" id="ltRail"><p class="muted">Loading…</p></div>
      <div class="lt-box lt-main" id="ltMain"></div>
    </div>
  </div>
  <div id="ltToast" class="lt-toast" style="display:none;"></div>
  <div id="ltSheet"></div>
</div>

<script src="staff_lights.js"></script>
<script src="/staff_cashout_link.js"></script>
<script src="/staff_bar_ipad.js"></script>
<script src="/quarter_time.js"></script>
</body>
</html>
