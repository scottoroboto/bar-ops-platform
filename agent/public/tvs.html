<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Venue Control Agent — TVs</title>
<style>
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #14171c; color: #e8eaed; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: #cfd3da; }
  a { color: #7fb7ff; }
  .muted { color: #9aa1ab; font-size: 13px; }
  .card { background: #1c2027; border-radius: 12px; padding: 16px 18px; margin-top: 16px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.on { background: rgba(63,191,127,0.18); color: #6be3a4; }
  .badge.off { background: rgba(229,86,109,0.18); color: #ff8a9a; }
  .badge.wait { background: rgba(154,161,171,0.18); color: #b6bcc6; }
  input, select { background: #11141a; border: 1px solid #2c313a; color: #e8eaed; border-radius: 8px; padding: 8px 10px; font-size: 14px; font-family: inherit; }
  button { background: #2c313a; border: 1px solid #3a404b; color: #e8eaed; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  button:hover { background: #353c47; }
  button.primary { background: #2b6cb0; border-color: #2b6cb0; }
  button.primary:hover { background: #3178c2; }
  button.danger { background: #7a2e3a; border-color: #7a2e3a; }
  button.danger:hover { background: #8f3644; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.small { padding: 5px 10px; font-size: 12.5px; }
  .zone-header { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
  .zone-header:first-child { margin-top: 0; }
  .zone-actions { display: flex; gap: 6px; }
  .tv-row { border-bottom: 1px solid #262b33; padding: 10px 0; }
  .tv-row:last-child { border-bottom: none; }
  .tv-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  .tv-name { font-size: 15px; font-weight: 600; }
  .tv-controls { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .tv-source-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  #pinGate .card { max-width: 340px; margin: 60px auto 0; }
  #app { display: none; }
  .msg { padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-top: 10px; }
  .msg.error { background: rgba(229,86,109,0.15); color: #ff8a9a; }
  .msg.success { background: rgba(63,191,127,0.15); color: #6be3a4; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
  dialog { background: #1c2027; color: #e8eaed; border: 1px solid #2c313a; border-radius: 12px; padding: 18px; max-width: 420px; }
  dialog::backdrop { background: rgba(0,0,0,0.5); }
  .fav-grid { display: flex; flex-wrap: wrap; gap: 8px; max-height: 300px; overflow-y: auto; }
  .fav-btn { display: flex; flex-direction: column; align-items: flex-start; min-width: 90px; }
  .fav-btn .cat { font-size: 10px; color: #9aa1ab; text-transform: uppercase; letter-spacing: 0.03em; }
</style>
</head>
<body>
<div class="wrap" id="pinGate">
  <div class="card">
    <h2>TVs</h2>
    <p class="muted">Enter the staff PIN to control TV power.</p>
    <div class="field"><input type="password" id="pinInput" placeholder="Staff PIN" autocomplete="off"></div>
    <button class="primary" onclick="submitPin()">Continue</button>
    <div id="pinMsg"></div>
  </div>
</div>

<div class="wrap" id="app">
  <h1>TVs</h1>
  <p class="muted">Turn TVs on or off, whole-room or one at a time. <a href="/">&larr; Agent status</a></p>

  <div class="card">
    <div class="zone-header">
      <h2 style="margin:0;">All TVs <span class="muted" id="refreshedAt"></span></h2>
      <div class="zone-actions">
        <button class="small" onclick="bulkPower('on')">All on</button>
        <button class="small" onclick="bulkPower('off')">All off</button>
      </div>
    </div>
    <div id="tvsBox"><p class="muted">Loading…</p></div>
  </div>
</div>

<dialog id="tvSourceDialog">
  <h2 style="margin-top:0;" id="tvSourceTitle">Choose a source</h2>
  <p class="muted" style="margin-top:-6px;">Sends the channel keys as if pressed on the remote -- confirm visually that it worked.</p>
  <div class="fav-grid" id="tvSourceGrid"></div>
  <div id="tvSourceMsg"></div>
  <div style="margin-top:12px;">
    <button onclick="document.getElementById('tvSourceDialog').close()">Close</button>
  </div>
</dialog>

<script src="tvs.js"></script>
</body>
</html>
