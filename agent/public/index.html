<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Venue Control Agent</title>
<style>
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #14171c; color: #e8eaed; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { color: #9aa1ab; font-size: 14px; }
  .card { background: #1c2027; border-radius: 12px; padding: 18px; margin-top: 18px; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #262b33; font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .row .k { color: #9aa1ab; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.on { background: rgba(63,191,127,0.18); color: #6be3a4; }
  .badge.off { background: rgba(229,86,109,0.18); color: #ff8a9a; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Venue Control Agent</h1>
  <p class="muted">Phase 0 — this box just proves it can reach TSB Platform. Nothing here controls a TV or receiver yet.</p>
  <div class="card" id="status">
    <p class="muted">Loading…</p>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
