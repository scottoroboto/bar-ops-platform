<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Venue Control Agent — Sources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="staff-theme.css">
</head>
<body class="staff">
<div class="wrap" id="pinGate">
  <div class="card">
    <h2>Sources</h2>
    <p class="muted">Enter the staff PIN to change channels.</p>
    <div class="field"><input type="password" id="pinInput" placeholder="Staff PIN" autocomplete="off"></div>
    <button class="primary" onclick="submitPin()">Continue</button>
    <div id="pinMsg"></div>
  </div>
</div>

<div id="app">
  <!-- Branded top bar (screens/01-staff-sources.html), shared shape across all
       three staff pages -- see staff-theme.css's .staff-topbar rules. The green
       dot doubles as the old "Agent status" link so that page is still one tap
       away without cluttering this header with its own text link. -->
  <div class="staff-topbar">
    <div class="staff-topbar-inner">
      <div class="tb-brand">
        <img class="tb-logo" src="ticket-logo.png" alt="Ticket Sports Bar">
        <div class="tb-divider"></div>
        <a href="/" title="Agent status"><span class="tb-conn-dot"></span></a>
      </div>
      <button class="tb-quick" onclick="openQuickDirectvRemote()">
        <svg width="15" height="19" viewBox="0 0 16 20" fill="none"><rect x="1" y="1" width="14" height="18" rx="3" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="5.5" r="1.5" fill="currentColor"/><path d="M4.5 10.5h7M4.5 14h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span class="label">DirecTV Remote</span>
      </button>
      <div class="tb-nav">
        <a href="/staff_sources.html" class="active">Sources</a>
        <a href="/staff_tvs.html">TVs</a>
        <a href="/staff_layouts.html">Layouts</a>
        <div class="tb-divider" style="height:40px; margin:0 6px;"></div>
        <div class="tb-clock">
          <div class="day" id="tbDay">—</div>
          <div class="time" id="tbTime">—</div>
          <div class="date" id="tbDate">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="card" id="favCard" style="display:none;">
      <h2>Favorites</h2>
      <div class="fav-grid" id="favGrid"></div>
    </div>

    <p class="muted" id="refreshedAt" style="margin: 4px 0 12px;"></p>
    <div class="source-grid" id="sourcesBox"><p class="muted">Loading…</p></div>
  </div>
</div>

<dialog id="quickRemoteDialog">
  <h2 style="margin-top:0;">DirecTV Remote</h2>
  <p class="muted">Pick a receiver.</p>
  <div class="remote-pick-grid" id="quickRemoteGrid"></div>
  <div style="margin-top:12px;">
    <button onclick="document.getElementById('quickRemoteDialog').close()">Cancel</button>
  </div>
</dialog>

<dialog id="tuneFavDialog">
  <h2 style="margin-top:0;" id="tuneFavTitle">Tune to favorite</h2>
  <p class="muted">Pick which receiver(s) to send this to.</p>
  <div id="tuneFavChecks"></div>
  <div id="tuneFavMsg"></div>
  <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end;">
    <button onclick="document.getElementById('tuneFavDialog').close()">Cancel</button>
    <button class="primary" onclick="submitTuneFav()">Tune</button>
  </div>
</dialog>

<dialog id="rokuAppsDialog">
  <h2 style="margin-top:0;" id="rokuAppsTitle">Apps</h2>
  <div id="rokuAppsMsg"></div>
  <div class="fav-grid" id="rokuAppsGrid"><p class="muted">Loading…</p></div>
  <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end;">
    <button onclick="document.getElementById('rokuAppsDialog').close()">Close</button>
  </div>
</dialog>

<!-- Full-screen channel picker (screens/02-staff-channel-picker.html): opened per
     receiver from its "Channels…" button. Favorites grid with live titles filled in
     progressively, plus a keypad fallback for a channel not saved as a favorite. -->
<div class="overlay" id="channelPicker">
  <div class="overlay-header">
    <div>
      <h1 style="font-size:18px; margin:0;" id="pickerTitle">Channels</h1>
      <p class="muted" style="margin:2px 0 0;">Tap a favorite, or use the keypad below.</p>
    </div>
    <button class="small" onclick="closeChannelPicker()">Close</button>
  </div>
  <div class="overlay-body">
    <div id="pickerBlastRadius"></div>

    <div class="card">
      <h2>Favorites</h2>
      <div class="channel-grid" id="pickerFavGrid"></div>
    </div>

    <div class="card">
      <h2>Guide &amp; keypad</h2>
      <div class="source-controls" style="margin-bottom:12px;">
        <button onclick="pickerSendKey('guide')">Guide</button>
        <button onclick="pickerSendKey('info')">Info</button>
      </div>
      <input type="text" id="pickerKeypadInput" placeholder="Channel" readonly style="width:140px; font-size:20px; text-align:center; margin-bottom:10px;">
      <div class="keypad">
        <button onclick="pickerKeypadPress('1')">1</button>
        <button onclick="pickerKeypadPress('2')">2</button>
        <button onclick="pickerKeypadPress('3')">3</button>
        <button onclick="pickerKeypadPress('4')">4</button>
        <button onclick="pickerKeypadPress('5')">5</button>
        <button onclick="pickerKeypadPress('6')">6</button>
        <button onclick="pickerKeypadPress('7')">7</button>
        <button onclick="pickerKeypadPress('8')">8</button>
        <button onclick="pickerKeypadPress('9')">9</button>
        <button onclick="pickerKeypadPress('.')">.</button>
        <button onclick="pickerKeypadPress('0')">0</button>
        <button onclick="pickerKeypadPress('back')">&larr;</button>
      </div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button onclick="pickerKeypadPress('clear')">Clear</button>
        <button class="primary" onclick="pickerKeypadTune()">Tune</button>
      </div>
    </div>
  </div>
</div>

<!-- Device-matched remote panels (screens/03-staff-remote-directv.html,
     screens/04-staff-remote-roku.html): opened per source from its "Remote…"
     button. #remotePanelBody is filled per-kind by openRemote() in staff_sources.js;
     #remoteStage shows the full sources grid dimmed behind it, with only the
     source the remote is bound to highlighted (single highlight, per §6). -->
<div class="overlay remote-overlay" id="remoteOverlay">
  <div class="remote-panel">
    <div class="remote-panel-header">
      <div><span class="title" id="remoteTitle">REMOTE</span> <span class="sub" id="remoteSub"></span></div>
      <button class="close" onclick="closeRemote()">&times;</button>
    </div>
    <div id="remotePanelBody"></div>
  </div>
  <div class="remote-stage" id="remoteStage"></div>
</div>

<script src="staff_sources.js"></script>
</body>
</html>
