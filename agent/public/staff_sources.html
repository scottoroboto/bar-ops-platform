<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Venue Control Agent — Sources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="staff-theme.css">
</head>
<body class="staff">
<div class="wrap" id="pinGate">
  <div class="card">
    <h2>Sources</h2>
    <p class="muted">Enter the staff PIN to change channels.</p>
    <div class="field"><input type="password" id="pinInput" placeholder="Staff PIN" autocomplete="off"></div>
    <button class="primary" onclick="submitPin()">Continue</button>
    <div id="pinMsg"></div>
  </div>
</div>

<div id="app">
  <!-- Branded top bar (screens/01-staff-sources.html), shared shape across all
       three staff pages -- see staff-theme.css's .staff-topbar rules. The green
       dot doubles as the old "Agent status" link so that page is still one tap
       away without cluttering this header with its own text link. -->
  <div class="staff-topbar">
    <div class="staff-topbar-inner">
      <div class="tb-brand">
        <img class="tb-logo" src="ticket-logo.png" alt="Ticket Sports Bar">
        <!-- Favorites (round 4, 2026-09-06): replaces the old two dedicated
             DirecTV/Roku "Remote" buttons that used to live here -- those are
             gone now that tapping a source card opens its full remote
             directly (see cardTap() in staff_sources.js). This is the one
             button left in this spot, opening the DirecTV-favorites picker
             overlay (#favOverlay) instead. -->
        <button class="tb-fav-btn" id="tbFavBtn" onclick="openFavorites()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7-5.4-4.7 7.1-.7L12 2.5Z"/></svg>
          <span class="label">Favorites</span>
        </button>
        <div class="tb-divider"></div>
        <a href="/" title="Agent status"><span class="tb-conn-dot"></span></a>
      </div>
      <div class="tb-nav">
        <a href="/staff_sources.html" class="active">Sources</a>
        <a href="/staff_tvs.html">TVs</a>
        <a href="/staff_layouts.html">Layouts</a>
        <div class="tb-divider" style="height:40px; margin:0 6px;"></div>
        <div class="tb-clock">
          <div class="day" id="tbDay">—</div>
          <div class="time" id="tbTime">—</div>
          <div class="date" id="tbDate">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap" id="sourcesWrap">
    <p class="muted" id="refreshedAt" style="margin: 4px 0 12px;"></p>
    <div class="source-grid" id="sourcesBox"><p class="muted">Loading…</p></div>
  </div>

  <!-- Device-matched remote panels (screens/03-staff-remote-directv.html,
       screens/04-staff-remote-roku.html): opened by tapping a live source
       card directly (cardTap() in staff_sources.js) -- round 4, 2026-09-06,
       replacing the old channel-picker/apps-dialog-first flow and the
       topbar's two dedicated Remote buttons. Swaps in for #sourcesWrap in
       place, same as the TVs page's inline TV Remote swap -- the branded
       topbar stays visible the whole time.
       #remoteStage shows ONLY sources of the same kind as the one bound
       (REMOTE_KIND) -- per Scotto's explicit instruction, this is filtered
       to "their devices" only rather than the mockup's literal mixed grid --
       with exactly one tile lit (the source actually being driven; only one
       device is ever controlled at a time).
       Header (round 4): no more "DIRECTV"/"ROKU" title line -- just the
       receiver + its QAM slot on the left (bigger now that there's no title
       line above them), and the live channel/app + program, right-justified
       next to the close button, on the right (Scotto's original "make text
       for Directv number and current station larger and right justified
       next to X" request). -->
  <div class="wrap remote-overlay" id="remoteOverlay">
    <div class="remote-stage" id="remoteStage"></div>
    <div class="remote-panel">
      <div class="remote-panel-header">
        <div>
          <div class="rcvr" id="remoteRcvr"></div>
          <div class="zone" id="remoteZone"></div>
        </div>
        <div class="now-row">
          <div class="now">
            <div class="now-chan" id="remoteNowChan"></div>
            <div class="now-prog" id="remoteNowProg"></div>
          </div>
          <button class="close" onclick="closeRemote()">&times;</button>
        </div>
      </div>
      <div id="remoteBlastRadius"></div>
      <div id="remotePanelBody"></div>
    </div>
  </div>

  <!-- Favorites overlay (round 4, 2026-09-06): opened from the topbar's
       Favorites button. Favorites are DirecTV-only (they're a saved
       channel, and only DirecTV receivers have channels), so this is a
       two-column picker rather than the old page-top strip: every saved
       favorite on the left, every DirecTV receiver on the right. Tap a
       receiver to select it (defaults to the first one), then tap a
       favorite to tune that receiver straight to it -- no more separate
       "which receiver(s)" dialog. -->
  <div class="fav-backdrop" id="favOverlay">
    <div class="fav-panel">
      <div class="fav-panel-header">
        <h1>Favorites</h1>
        <button class="close" onclick="closeFavorites()">&times;</button>
      </div>
      <div class="fav-panel-cols">
        <div class="col-favs">
          <h2><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7-5.4-4.7 7.1-.7L12 2.5Z"/></svg>Favorites — tap to tune</h2>
          <div class="fav-tile-grid" id="favTileGrid"></div>
        </div>
        <div class="col-divider"></div>
        <div class="col-directv">
          <h2><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M8 21h8M12 18v3"/></svg>DirecTV Receivers — then pick one</h2>
          <div class="rcv-tile-grid" id="favRcvGrid"></div>
        </div>
      </div>
      <div class="fav-panel-footer" id="favFooter"></div>
    </div>
  </div>
</div>

<dialog id="rokuAppsDialog">
  <h2 style="margin-top:0;" id="rokuAppsTitle">Apps</h2>
  <div id="rokuAppsMsg"></div>
  <div class="fav-grid" id="rokuAppsGrid"><p class="muted">Loading…</p></div>
  <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end;">
    <button onclick="document.getElementById('rokuAppsDialog').close()">Close</button>
  </div>
</dialog>

<script src="staff_sources.js"></script>
</body>
</html>
