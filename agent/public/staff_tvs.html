<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<!-- Add to Home Screen opens these full screen, no Safari bars (bar iPads, patch_053) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ticket TVs">
<link rel="apple-touch-icon" href="/ticket-logo.png">
<script src="/staff_pass_boot.js"></script>
<title>Venue Control Agent — TVs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="staff-theme.css">
</head>
<body class="staff">
<div class="wrap" id="pinGate" style="display:none;">
  <div class="card">
    <h2>TVs</h2>
    <p class="muted">This screen opens from the Bar Ops app. Tap <strong>TV Staff</strong> there and you'll land back here signed in.</p>
    <a class="primary" id="openFromApp" href="#" style="display:inline-block; text-decoration:none;">Open the Bar Ops app</a>
    <div id="pinMsg"></div>
  </div>
</div>

<div id="app">
  <!-- Branded top bar, shared shape with staff_sources.html/staff_layouts.html
       -- see staff-theme.css's .staff-topbar rules. ALL TVs ON / ALL TVs OFF
       (hold) / TV REMOTE now live here in the bar itself, matching
       screens/05-staff-tvs.html and screens/06-staff-remote-tv.html exactly
       -- not in a per-page zone-actions row like the old per-TV grid used. -->
  <div class="staff-topbar">
    <div class="staff-topbar-inner">
      <div class="tb-brand">
        <img class="tb-logo" src="ticket-logo.png" alt="Ticket Sports Bar">
        <div class="tb-divider"></div>
        <a href="/" title="Agent status"><span class="tb-conn-dot"></span></a>
      </div>
      <div class="tb-actions">
        <!-- TV Remote: icon only, first in the row (Scotto, 2026-10-05). -->
        <button class="tva-btn tva-remote tva-remote-icon" id="tvRemoteToggle" onclick="toggleTvRemote()" title="TV Remote" aria-label="TV Remote">
          <svg width="54" height="30" viewBox="0 14 71 40" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <g transform="rotate(90 30 34)">
              <rect x="19" y="6" width="22" height="52" rx="11" stroke-width="2.8"/>
              <circle cx="35" cy="13" r="2.2" fill="currentColor" stroke="none"/>
              <rect x="27.6" y="16.6" width="4.8" height="4.8" rx="1.3" fill="currentColor" stroke="none"/>
              <rect x="27.6" y="28.6" width="4.8" height="4.8" rx="1.3" fill="currentColor" stroke="none"/>
              <rect x="21.6" y="22.6" width="4.8" height="4.8" rx="1.3" fill="currentColor" stroke="none"/>
              <rect x="33.6" y="22.6" width="4.8" height="4.8" rx="1.3" fill="currentColor" stroke="none"/>
              <circle cx="30" cy="25" r="2.5" fill="currentColor" stroke="none"/>
              <path d="M24 38.5h2.6M29 38.5h2.6M34 38.5h2.6M24 43.5h2.6M29 43.5h2.6M34 43.5h2.6M26.5 48.5h2.6M31.5 48.5h2.6" stroke-width="2.2"/>
            </g>
            <path d="M62.6 30.1A6 6 0 0 1 62.6 37.9M65.7 27.6A10 10 0 0 1 65.7 40.4M68.7 25A14 14 0 0 1 68.7 43" stroke-width="2.6"/>
          </svg>
        </button>
        <button class="tva-btn tva-on" onclick="bulkPower('on')">ALL TVs ON</button>
        <button class="tva-btn tva-off hold-danger" data-hold-action="off"><span class="hold-fill"></span><span class="hold-label">ALL TVs OFF <span class="hold-chip">HOLD</span></span></button>
      </div>
      <div class="tb-nav">
        <a href="/staff_sources.html">Sources</a>
        <a href="/staff_tvs.html" class="active">TVs</a>
        <a href="/staff_layouts.html">Routines</a>
        <a href="/staff_events.html">Events</a>
        <a href="/staff_power.html">Power</a>
        <a href="/staff_lights.html">Lights</a>
        <a href="/staff_music.html">Music</a>
        <a id="navCashOut" href="#" style="display:none;">Cash Out</a>
        <div class="tb-divider" style="height:40px; margin:0 6px;"></div>
        <div class="tb-clock">
          <div class="day" id="tbDay">—</div>
          <div class="time" id="tbTime">—</div>
          <div class="date" id="tbDate">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Both columns are fully JS-rendered (renderPage() in staff_tvs.js) --
       #tvsColSource swaps between the source rail (1 - Pick a source) and
       the inline TV Remote panel; #tvsColTvs swaps its header/legend and its
       sticky bottom bar between "pick the TVs to move" / commit and
       "tap TVs to aim the remote" / receiving-the-remote, per Scotto's
       instruction that the remote replaces the source box in place rather
       than opening as a separate overlay. -->
  <div class="wrap">
    <div id="attentionBox"><div id="attentionFlash"></div><div id="attentionCard"></div></div>
    <div id="bulkProgress"></div>
    <div class="tvs-workspace">
      <div class="tvs-col-source" id="tvsColSource"><p class="muted">Loading…</p></div>
      <div class="tvs-col-tvs" id="tvsColTvs"></div>
    </div>
  </div>
</div>

<!-- Events & scenes modals (patch_043): capture/edit form, plain confirms
     for Apply now / End / scene apply, and the event-conflict popup. One
     backdrop, the panel is re-rendered per use by staff_tvs.js. -->
<div class="fav-backdrop" id="evOverlay">
  <div class="fav-panel ev-panel" id="evPanel"></div>
</div>

<script src="staff_tvs.js"></script>
<script src="staff_events.js"></script>
<script src="staff_music_strip.js"></script>
<script src="/staff_cashout_link.js"></script>
<script src="/staff_bar_ipad.js"></script>
</body>
</html>
